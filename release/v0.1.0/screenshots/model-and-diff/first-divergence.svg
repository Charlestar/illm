<text x="762" y="534" font-size="16" fill="#1d2d44">max relative error: 241.06663099502407</text>
<text x="762" y="563" font-size="16" fill="#1d2d44">first expected value: 0.11220268160104752</text>
<text x="762" y="592" font-size="16" fill="#1d2d44">first actual value: 0.06406726688146591</text>
<text x="762" y="621" font-size="16" fill="#1d2d44">tolerance: atol=0.0001, rtol=0.001</text>
<text x="762" y="650" font-size="16" fill="#1d2d44">profile: tiny-fp32-op-v1</text>
<rect x="746" y="702" width="655" height="118" rx="12" fill="#fff1f0" stroke="#bb3434"/><text x="764" y="732" font-size="20" fill="#1d2d44">Measured final output (expected -&gt; actual)</text><text x="764" y="760" font-size="16" fill="#1d2d44">greedy token: 114 -&gt; 0 | token mismatch: true</text>
<text x="764" y="784" font-size="16" fill="#1d2d44">final-logit max absolute error: 0.5620092749595642</text>
<text x="762" y="859" font-size="16" fill="#1d2d44">Injected mutations: 2 (Q transpose; final norm zero)</text>
<text x="762" y="885" font-size="16" fill="#1d2d44">A changed argmax is not attributed to transpose alone.</text>
<text x="762" y="946" font-size="13" fill="#1d2d44">Report: fault-q-transpose-and-zero-final-norm.json</text>
<text x="762" y="975" font-size="12" fill="#1d2d44">SHA256: 6a8f0bf2f3e077027a3295b2deb34ebe1b911527c9a2d4987bf39c50050c7f25</text>
<text x="38" y="1040" font-size="17" fill="#1d2d44">Fault experiments intentionally FAIL numerical comparison; their diagnostic checks PASS because the first wrong operator is found.</text>
<text x="38" y="1074" font-size="16" fill="#1d2d44">The portable profile verifier checks fault transformations, per-op order, frozen tolerances and measured output effects before drawing.</text>
<text x="38" y="1106" font-size="16" fill="#1d2d44">No performance, trained-model quality, UI rendering or universal hardware support claim is made by these derived diagrams.</text>
