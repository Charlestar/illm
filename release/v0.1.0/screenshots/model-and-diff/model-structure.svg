<rect x="746" y="856" width="655" height="118" rx="12" fill="#f0f7ff" stroke="#4a709a"/><text x="764" y="886" font-size="20" fill="#1d2d44">Gated SiLU MLP + residual</text><text x="764" y="914" font-size="16" fill="#1d2d44">gate/up [64,32] -&gt; SiLU(gate) * up [B,T,64]</text>
<text x="764" y="938" font-size="16" fill="#1d2d44">down [32,64] -&gt; [B,T,32] + residual</text>
