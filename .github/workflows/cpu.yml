name: reference-cpu-clean-room

on:
  push:
  pull_request:

jobs:
  legacy-format-contract:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap the minimal schema0 toolchain
        run: python scripts/bootstrap.py --profile legacy-contract --locked --offline --write-manifest out/legacy/toolchain.json --write-manifest-digest out/legacy/toolchain.sha256
      - name: Exercise the retained V0 producer and runner contracts
        run: python scripts/in_env.py --manifest out/legacy/toolchain.json --expected-manifest-digest-file out/legacy/toolchain.sha256 -- python -m pytest tests/cpu/test_qualification.py tests/cpu/test_toolchain_runner.py --junitxml out/legacy/junit.xml
      - name: Verify the immutable published V0 bundle with its historical facts
        run: python scripts/in_env.py --manifest out/legacy/toolchain.json --expected-manifest-digest-file out/legacy/toolchain.sha256 -- python -m illm release verify release/v0.0.0/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-format-${{ matrix.os }}
          path: out/legacy
          if-no-files-found: error
  reference:
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: v01-ci-windows
            python: "3.12.10"
            runtime: py312-win-amd64-cpu-ci
          - os: ubuntu-latest
            profile: v01-ci-linux
            python: "3.12.3"
            runtime: py312-linux-x86_64-cpu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch and hash-verify the selected CPU runtime wheels
        run: python scripts/fetch_runtime.py --runtime-profile ${{ matrix.runtime }} --artifact-cache .illm/cache/runtime
      - name: Bootstrap locked environment without network resolution
        run: python scripts/bootstrap.py --profile ${{ matrix.profile }} --runtime-profile ${{ matrix.runtime }} --locked --offline --write-manifest out/v0.1/toolchain.json --write-manifest-digest out/v0.1/toolchain.sha256
      - name: CPU, model and fault-injection tests
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m pytest tests --junitxml out/v0.1/junit.xml
      - name: Static quality and annotation gate
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python scripts/check_quality.py --output out/v0.1/quality.json
      - name: Version SPEC validation
        shell: pwsh
        run: ./scripts/validate_specs.ps1 -RepositoryRoot .
      - name: Audit the committed historical release bundle
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm release verify release/v0.0.0/manifest.json
      - name: Independently verify the historical V0.1 bundle when present
        if: ${{ hashFiles('release/v0.1.0/manifest.json') != '' }}
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm release verify release/v0.1.0/manifest.json
      - name: Verify V0.2 bundle when present or required by its tag
        if: ${{ github.ref == 'refs/tags/v0.2.0' || hashFiles('release/v0.2.0/manifest.json') != '' }}
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python scripts/check_v02_release_snapshot.py --manifest release/v0.2.0/manifest.json --ci
      - name: Toy capture
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm demo toy-scheduler --seed 7 --steps 20 --capture out/v0.0
      - name: R0 playback
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm replay out/v0.0 --mode trace
      - name: R1 replay
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm replay out/v0.0 --mode state --assert-state-digest
      - name: Inspect tiny model
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm model inspect --model fixture:tiny-decoder
      - name: Generate with op metadata capture
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm generate --model fixture:tiny-decoder --prompt hello --max-new-tokens 8 --seed 7 --telemetry ops --capture out/v0.1-tiny
      - name: Reference R0 trace playback
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm replay out/v0.1-tiny --mode trace --step-id 0
      - name: Reference R1 control replay (not numerical reexecution)
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm replay out/v0.1-tiny --mode state --assert-state-digest
      - name: Independent pinned Transformers oracle
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm model validate --model fixture:tiny-decoder --against transformers --output-directory out/v0.1/oracle
      - name: V0.2 source-bound tiny differential check (not release qualification)
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python scripts/validate_stateful.py --model fixture:tiny-decoder --device cpu --scope full --output out/v0.2/stateful-full
      - name: V0.2 lifecycle and fault matrix (CPU injections, not GPU faults)
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python scripts/exercise_streaming.py --output out/v0.2/exercise
      - name: V0.2 streaming demo
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm run --model fixture:tiny-decoder --prompt hello --max-new-tokens 8 --seed 7 --stream --capture out/v0.2/demo-capture
      - name: V0.2 metadata-only request story
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python -m illm inspect request out/v0.2/demo-capture --request req-0001 --chrome-trace out/v0.2/chrome-trace.json
      - name: Derive V0.2 learning views from recorded cancellation
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python scripts/render_streaming_learning.py out/v0.2/exercise/captures/cancel-after-launch --output out/v0.2/learning
      - name: Independently regenerate V0.2 learning views
        run: python scripts/in_env.py --manifest out/v0.1/toolchain.json --expected-manifest-digest-file out/v0.1/toolchain.sha256 -- python scripts/render_streaming_learning.py out/v0.2/exercise/captures/cancel-after-launch --output out/v0.2/learning --verify-existing
      - name: Upload development check artifacts (not a release qualification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.1-${{ matrix.profile }}-checks
          path: |
            out/v0.1
            out/v0.1-tiny
            out/v0.0
            out/v0.2
          if-no-files-found: error
